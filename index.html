function addKillfeed(text) {
  game.killfeed.push({ text, time: game.time });
  while (game.killfeed.length > CONFIG.KILLFEED_MAX) game.killfeed.shift();
}

function spawnParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    const angle = rand(0, Math.PI * 2);
    const speed = rand(0.4, 3.2);
    game.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: rand(220, 520),
      maxLife: 520,
      color,
      size: rand(1.5, 3.5),
    });
  }
}

/* =========================================================================
   11. СПАВН ПЕРСОНАЖЕЙ
   ========================================================================= */

function findSpawnPoint(minDistanceFromCenter, minDistanceFromPlayer) {
  for (let attempt = 0; attempt < 400; attempt++) {
    const x = rand(70, MAP_SIZE - 70);
    const y = rand(70, MAP_SIZE - 70);
    if (distance(x, y, MAP_CENTER, MAP_CENTER) < minDistanceFromCenter) continue;
    const player = game.player;
    if (player && distance(x, y, player.x, player.y) < minDistanceFromPlayer) continue;
    const walls = game.wallGrid.queryCircle(x, y, 40, scratchWalls);
    let blocked = false;
    for (let i = 0; i < walls.length; i++) {
      if (circleRectOverlap(x, y, CONFIG.CHARACTER_RADIUS + 4, walls[i])) {
        blocked = true;
        break;
      }
    }
    if (blocked) continue;
    const trunks = game.trunkGrid.queryCircle(x, y, 40, scratchTrunks);
    for (let i = 0; i < trunks.length; i++) {
      if (distance(x, y, trunks[i].x, trunks[i].y) < trunks[i].trunkRadius + CONFIG.CHARACTER_RADIUS + 4) {
        blocked = true;
        break;
      }
    }
    if (blocked) continue;
    return { x, y };
  }
  return { x: rand(100, MAP_SIZE - 100), y: rand(100, MAP_SIZE - 100) };
}

function spawnCharacters() {
  characterSerial = 0;
  const player = new Character(MAP_CENTER, MAP_CENTER, true);
  player.giveWeapon("pistol", WEAPONS.pistol.magSize, WEAPONS.pistol.reserve);
  player.medkits = 1;
  game.player = player;
  game.characters.push(player);

  const botPoints = [];
  for (let i = 1; i < CONFIG.TOTAL_PLAYERS; i++) {
    let point = findSpawnPoint(420, 520);
    for (let attempt = 0; attempt < 40; attempt++) {
      let tooClose = false;
      for (let k = 0; k < botPoints.length; k++) {
        if (distance(point.x, point.y, botPoints[k].x, botPoints[k].y) < 200) {
          tooClose = true;
          break;
        }
      }
      if (!tooClose) break;
      point = findSpawnPoint(420, 520);
    }
    botPoints.push(point);
    const bot = new Character(point.x, point.y, false);
    bot.name = "Бот " + i;
    if (Math.random() < 0.45) {
      const id = pick(["pistol", "pistol", "rifle", "shotgun", "sniper"]);
      const def = WEAPONS[id];
      bot.giveWeapon(id, def.magSize, Math.round(def.reserve * rand(0.4, 0.9)));
    }
    if (Math.random() < 0.3) bot.medkits = randInt(1, 2);
    if (Math.random() < 0.22) bot.armor = randInt(25, 60);
    game.characters.push(bot);
  }
}

/* =========================================================================
   12. ИСКУССТВЕННЫЙ ИНТЕЛЛЕКТ БОТОВ
   ========================================================================= */

function hasLineOfSight(ax, ay, bx, by) {
  const dx = bx - ax;
  const dy = by - ay;
  const dist = Math.hypot(dx, dy);
  if (dist < 1) return true;
  const steps = Math.ceil(dist / 22);
  for (let i = 1; i < steps; i++) {
    const px = ax + (dx * i) / steps;
    const py = ay + (dy * i) / steps;
    const walls = game.wallGrid.queryCircle(px, py, 4, scratchWalls);
    for (let j = 0; j < walls.length; j++) {
      if (pointInRect(px, py, walls[j])) return false;
    }
  }
  return true;
}

function findNearestEnemy(bot) {
  let best = null;
  let bestDist = CONFIG.BOT_VISION;
  for (let i = 0; i < game.characters.length; i++) {
    const other = game.characters[i];
    if (other === bot || other.isDead) continue;
    if (other.isInBush) continue;
    const d = distance(bot.x, bot.y, other.x, other.y);
    if (d > bestDist) continue;
    if (!hasLineOfSight(bot.x, bot.y, other.x, other.y)) continue;
    best = other;
    bestDist = d;
  }
  return best;
}

function findNearestBush(bot, maxRadius) {
  let best = null;
  let bestDist = maxRadius;
  for (let i = 0; i < game.bushes.length; i++) {
    const bush = game.bushes[i];
    const d = distance(bot.x, bot.y, bush.x, bush.y);
    if (d < bestDist) {
      best = bush;
      bestDist = d;
    }
  }
  return best;
}

function findLootFor(bot) {
  const wantsWeapon = !bot.currentWeapon || bot.totalAmmo < 12;
  const wantsHeal = bot.hp < 75 && bot.medkits < 3;
  const wantsArmor = bot.armor < 40;
  let best = null;
  let bestScore = Infinity;

  for (let i = 0; i < game.loot.length; i++) {
    const item = game.loot[i];
    const d = distance(bot.x, bot.y, item.x, item.y);
    if (d > 900) continue;
    let priority = null;
    if (item.kind === "weapon" && wantsWeapon) priority = 0;
    else if (item.kind === "weapon" && bot.currentWeapon) {
      const current = bot.weaponDef;
      const candidate = WEAPONS[item.type];
      if (current && candidate.cooldown < current.cooldown && candidate.range > 500) priority = 2;
    }
    if (item.kind === "medkit" && wantsHeal) priority = 1;
    if (item.kind === "armor" && wantsArmor) priority = 2;
    if (priority === null) continue;
    const score = d + priority * 400;
    if (score < bestScore) {
      bestScore = score;
      best = item;
    }
  }
  return best;
}

function pickUpLoot(character, item) {
  if (!item) return false;
  if (item.kind === "weapon") {
    const current = character.currentWeapon;
    character.giveWeapon(item.type, item.mag, item.reserve);
    removeLoot(item);
    if (character.isPlayer) Sound.pickup();
    if (current && character.isPlayer) {
      addLoot({
        kind: "weapon",
        type: current.type,
        mag: current.mag,
        reserve: current.reserve,
        x: clamp(character.x + rand(-18, 18), 40, MAP_SIZE - 40),
        y: clamp(character.y + rand(-18, 18), 40, MAP_SIZE - 40),
        bob: Math.random() * Math.PI * 2,
      });
    }
    return true;
  }
  if (item.kind === "medkit") {
    if (character.medkits >= CONFIG.MAX_MEDKITS) return false;
    character.medkits++;
    removeLoot(item);
    return true;
  }
  if (item.kind === "armor") {
    if (character.armor >= character.maxArmor) return false;
    character.armor = Math.min(character.maxArmor, character.armor + item.amount);
    removeLoot(item);
    return true;
  }
  return false;
}

function botAutoPickup(bot) {
  for (let i = game.loot.length - 1; i >= 0; i--) {
    const item = game.loot[i];
    if (distance(bot.x, bot.y, item.x, item.y) > CONFIG.BOT_PICKUP_RADIUS) continue;
    let beneficial = false;
    if (item.kind === "weapon") {
      const current = bot.weaponDef;
      const candidate = WEAPONS[item.type];
      beneficial = !current ||
        (candidate.damage * candidate.pellets) / candidate.cooldown >
        (current.damage * current.pellets) / current.cooldown;
    } else if (item.kind === "medkit") {
      beneficial = bot.medkits < 3;
    } else if (item.kind === "armor") {
      beneficial = bot.armor < 60;
    }
    if (beneficial) pickUpLoot(bot, item);
  }
}

function botThink(bot) {
  const zone = game.zone;
  const inZone = zone.contains(bot.x, bot.y);
  const distanceToCenter = distance(bot.x, bot.y, zone.x, zone.y);
  const nearEdge = distanceToCenter > zone.radius - 70;

  if (!inZone || (zone.state === "shrink" && nearEdge)) {
    bot.state = "RUN_TO_ZONE";
    const target = zone.finished
      ? { x: zone.x, y: zone.y }
      : { x: zone.target.x, y: zone.target.y };
    const angle = rand(0, Math.PI * 2);
    const spread = Math.max(20, zone.target.radius * 0.55);
    bot.goal = {
      x: clamp(target.x + Math.cos(angle) * spread, 60, MAP_SIZE - 60),
      y: clamp(target.y + Math.sin(angle) * spread, 60, MAP_SIZE - 60),
    };
    bot.goalTimer = 4000;
    return;
  }

  if (bot.hp < 30 && bot.medkits > 0 && !bot.isHealing && !bot.isPlayer) {
    bot.state = "FLEE";
    const bush = findNearestBush(bot, 520);
    const enemy = findNearestEnemy(bot);
    if (bush && (!enemy || distance(bot.x, bot.y, enemy.x, enemy.y) > 90)) {
      bot.goal = { x: bush.x, y: bush.y };
    } else if (enemy) {
      const away = angleTo(enemy.x, enemy.y, bot.x, bot.y);
      bot.goal = {
        x: clamp(bot.x + Math.cos(away) * 260, 60, MAP_SIZE - 60),
        y: clamp(bot.y + Math.sin(away) * 260, 60, MAP_SIZE - 60),
      };
    } else {
      bot.goal = { x: bot.x, y: bot.y };
    }
    bot.goalTimer = 3000;
    return;
  }

  const enemy = findNearestEnemy(bot);
  if (enemy) {
    if (bot.state !== "COMBAT") {
      bot.reactionTimer = rand(120, 520) * (1.4 - bot.skill * 0.6);
    }
    bot.state = "COMBAT";
    bot.target = enemy;
    return;
  }

  bot.target = null;

  if (!bot.currentWeapon || bot.totalAmmo < 10 || (bot.hp < 75 && bot.medkits < 2) || bot.armor < 30) {
    const loot = findLootFor(bot);
    if (loot) {
      bot.state = "LOOTING";
      bot.goal = { x: loot.x, y: loot.y };
      bot.goalTimer = 2500;
      return;
    }
  }

  bot.state = "LOOTING";
  if (!bot.goal || distance(bot.x, bot.y, bot.goal.x, bot.goal.y) < 45 || bot.goalTimer <= 0) {
    const target = game.zone.finished
      ? { x: game.zone.x, y: game.zone.y }
      : { x: game.zone.target.x, y: game.zone.target.y };
    const radius = Math.min(game.zone.target.radius * 0.8, 520);
    const angle = rand(0, Math.PI * 2);
    const r = Math.sqrt(Math.random()) * radius;
    bot.goal = {
      x: clamp(target.x + Math.cos(angle) * r, 60, MAP_SIZE - 60),
      y: clamp(target.y + Math.sin(angle) * r, 60, MAP_SIZE - 60),
    };
  }
  bot.goalTimer = 4000;
}

function botCombat(bot, dt) {
  const target = bot.target;
  if (!target || target.isDead || !bot.currentWeapon) {
    bot.state = "LOOTING";
    bot.target = null;
    return;
  }

  const dist = distance(bot.x, bot.y, target.x, target.y);
  const desiredAngle = angleTo(bot.x, bot.y, target.x, target.y);
  bot.angle = desiredAngle;

  if (dist > 600) {
    bot.state = "LOOTING";
    bot.target = null;
    return;
  }

  bot.losTimer -= dt;
  if (bot.losTimer <= 0) {
    bot.losTimer = 160;
    bot.losOk = hasLineOfSight(bot.x, bot.y, target.x, target.y);
  }

  let moveX = 0;
  let moveY = 0;

  if (dist > 320) {
    moveX = Math.cos(desiredAngle);
    moveY = Math.sin(desiredAngle);
  } else if (dist < 130) {
    moveX = -Math.cos(desiredAngle);
    moveY = -Math.sin(desiredAngle);
  } else {
    bot.strafeTimer -= dt;
    if (bot.strafeTimer <= 0) {
      bot.strafeDir *= -1;
      bot.strafeTimer = rand(500, 1200);
    }
    moveX = Math.cos(desiredAngle + Math.PI / 2) * bot.strafeDir;
    moveY = Math.sin(desiredAngle + Math.PI / 2) * bot.strafeDir;
  }

  if (moveX !== 0 || moveY !== 0) bot.move(moveX, moveY, dt, false);
  else bot.moving = 0;

  const def = bot.weaponDef;
  if (!def) return;
  if (dist > def.range) return;
  if (!bot.losOk) return;
  if (bot.reactionTimer > 0) {
    bot.reactionTimer -= dt;
    return;
  }

  if (bot.burstPause > 0) {
    bot.burstPause -= dt;
    return;
  }
  const now = game.time;
  if (bot.reloadTimer > 0) return;
  if (bot.currentWeapon.mag <= 0) {
    bot.startReload();
    return;
  }
  if (now - bot.lastShotAt < def.cooldown) return;

  if (bot.burstPause > 0) return;
  const aimError = (1 - bot.skill) * 0.5 + dist * 0.00045 + def.spread * 0.5;
  bot.angle = desiredAngle + (Math.random() - 0.5) * 2 * aimError;
  bot.shoot(now);
  if (bot.currentWeapon) bot.angle = desiredAngle;

  if (def.auto) {
    if (bot.burstLeft <= 0) bot.burstLeft = randInt(3, 7);
    bot.burstLeft--;
    if (bot.burstLeft <= 0) bot.burstPause = rand(350, 900);
  } else {
    bot.burstPause = rand(120, 380);
  }
}

function botMoveToGoal(bot, dt, speedScale) {
  if (!bot.goal) {
    bot.moving = 0;
    return;
  }
  const dx = bot.goal.x - bot.x;
  const dy = bot.goal.y - bot.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 18) {
    bot.moving = 0;
    return;
  }

  bot.angle = Math.atan2(dy, dx);
  let dirX = dx / dist;
  let dirY = dy / dist;

  if (bot.avoidTimer > 0) {
    bot.avoidTimer -= dt;
    const perpX = -dirY * bot.avoidDir;
    const perpY = dirX * bot.avoidDir;
    dirX = perpX;
    dirY = perpY;
  }

  bot.move(dirX, dirY, dt, false);

  bot.stuckTimer += dt;
  if (bot.stuckTimer > 420) {
    const moved = distance(bot.x, bot.y, bot.lastPosX, bot.lastPosY);
    if (moved < 6) {
      bot.avoidTimer = rand(280, 620);
      bot.avoidDir = Math.random() < 0.5 ? -1 : 1;
      bot.goalTimer = Math.min(bot.goalTimer, 500);
    }
    bot.lastPosX = bot.x;
    bot.lastPosY = bot.y;
    bot.stuckTimer = 0;
  }
}

function updateBot(bot, dt) {
  bot.thinkTimer -= dt;
  if (bot.thinkTimer <= 0) {
    bot.thinkTimer = rand(180, 320);
    botThink(bot);
  }

  switch (bot.state) {
    case "COMBAT":
      botCombat(bot, dt);
      break;
    case "FLEE": {
      if (bot.isHealing) {
        bot.moving = 0;
        break;
      }
      const inBushNow = bot.isInBush;
      const enemy = findNearestEnemy(bot);
      const safeDistance = !enemy || distance(bot.x, bot.y, enemy.x, enemy.y) > 420;
      if (inBushNow || safeDistance) {
        if (bot.medkits > 0) bot.useMedkit();
        else bot.state = "LOOTING";
        bot.moving = 0;
        break;
      }
      botMoveToGoal(bot, dt, 1.15);
      break;
    }
    case "RUN_TO_ZONE": {
      if (!bot.goal) {
        bot.goal = { x: game.zone.target.x, y: game.zone.target.y };
      }
      botMoveToGoal(bot, dt, 1.1);
      break;
    }
    default: {
      botMoveToGoal(bot, dt, 1);
      break;
    }
  }

  botAutoPickup(bot);

  if (bot.currentWeapon && bot.currentWeapon.mag <= 0 && bot.currentWeapon.reserve > 0 && bot.reloadTimer <= 0) {
    bot.startReload();
  }
}

/* =========================================================================
   13. ИГРОК: УПРАВЛЕНИЕ
   ========================================================================= */

function updatePlayer(dt) {
  const player = game.player;
  if (!player || player.isDead) return;

  const worldMouseX = mouse.x + game.camera.x;
  const worldMouseY = mouse.y + game.camera.y;
  player.angle = angleTo(player.x, player.y, worldMouseX, worldMouseY);

  let moveX = 0;
  let moveY = 0;
  if (keys["w"] || keys["arrowup"]) moveY -= 1;
  if (keys["s"] || keys["arrowdown"]) moveY += 1;
  if (keys["a"] || keys["arrowleft"]) moveX -= 1;
  if (keys["d"] || keys["arrowright"]) moveX += 1;

  if (moveX !== 0 || moveY !== 0) {
    const length = Math.hypot(moveX, moveY);
    moveX /= length;
    moveY /= length;
    player.move(moveX, moveY, dt, true);
  } else {
    player.moving = 0;
  }

  const def = player.weaponDef;
  if (def) {
    const wantsFire = def.auto ? mouse.down : mouse.pressed;
    if (wantsFire && player.canShoot(game.time)) player.shoot(game.time);
  }
}

/* =========================================================================
   14. ОБНОВЛЕНИЕ МИРА
   ========================================================================= */

function rebuildCharacterGrid() {
  game.charGrid.cells.clear();
  for (let i = 0; i < game.characters.length; i++) {
    const c = game.characters[i];
    if (c.isDead) continue;
    game.charGrid.insertCircle(c, c.x, c.y, c.radius);
  }
}

function resolveCharacterCollisions() {
  const chars = game.characters;
  for (let i = 0; i < chars.length; i++) {
    const a = chars[i];
    if (a.isDead) continue;
    const near = game.charGrid.queryCircle(a.x, a.y, a.radius * 3, scratchChars);
    for (let j = 0; j < near.length; j++) {
      const b = near[j];
      if (b === a || b.isDead) continue;
      if (b.id < a.id) continue;
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const minDist = a.radius + b.radius;
      const distSq = dx * dx + dy * dy;
      if (distSq >= minDist * minDist) continue;
      let nx;
      let ny;
      let dist;
      if (distSq > 0.0001) {
        dist = Math.sqrt(distSq);
        nx = dx / dist;
        ny = dy / dist;
      } else {
        dist = 0;
        const angle = rand(0, Math.PI * 2);
        nx = Math.cos(angle);
        ny = Math.sin(angle);
      }
      const overlap = minDist - dist;
      const push = overlap / 2 + 0.01;
      a.x -= nx * push;
      a.y -= ny * push;
      b.x += nx * push;
      b.y += ny * push;
      a.x = clamp(a.x, a.radius, MAP_SIZE - a.radius);
      a.y = clamp(a.y, a.radius, MAP_SIZE - a.radius);
      b.x = clamp(b.x, b.radius, MAP_SIZE - b.radius);
      b.y = clamp(b.y, b.radius, MAP_SIZE - b.radius);
    }
  }
}

function updateParticles(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      game.particles.splice(i, 1);
      continue;
    }
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.94;
    p.vy *= 0.94;
  }
}

function update(dt) {
  game.time += dt;

  if (game.state !== "playing") {
    game.camera.follow(game.player, dt);
    updateParticles(dt);
    if (game.bulletsOwnerHit > 0) game.bulletsOwnerHit -= dt;
    mouse.pressed = false;
    if (redFlash.style.opacity !== "0" && game.state !== "over") redFlash.style.opacity = "0";
    return;
  }

  game.elapsed += dt;
  rebuildCharacterGrid();

  updatePlayer(dt);

  for (let i = 0; i < game.characters.length; i++) {
    const c = game.characters[i];
    if (c.isDead) continue;
    if (c.isPlayer) c.update(dt);
    else {
      c.update(dt);
      if (!c.isDead) updateBot(c, dt);
    }
  }

  resolveCharacterCollisions();

  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const bullet = game.bullets[i];
    bullet.update(dt);
    if (bullet.dead) game.bullets.splice(i, 1);
  }

  game.zone.update(dt);
  updateParticles(dt);

  for (let i = game.killfeed.length - 1; i >= 0; i--) {
    if (game.time - game.killfeed[i].time > CONFIG.KILLFEED_LIFE) game.killfeed.splice(i, 1);
  }

  game.camera.follow(game.player, dt);

  if (game.bulletsOwnerHit > 0) game.bulletsOwnerHit -= dt;

  if (game.player.hitFlash > 0) {
    redFlash.style.opacity = String(clamp(game.player.hitFlash / 160, 0, 1) * 0.85);
  } else if (redFlash.style.opacity !== "0") {
    redFlash.style.opacity = "0";
  }

  mouse.pressed = false;

  checkVictory();
}

/* =========================================================================
   15. ОТРИСОВКА
   ========================================================================= */

let groundPattern = null;
let minimapTerrain = null;

function createGroundPattern() {
  const tile = document.createElement("canvas");
  tile.width = 160;
  tile.height = 160;
  const tc = tile.getContext("2d");
  tc.fillStyle = "#3f6b38";
  tc.fillRect(0, 0, 160, 160);
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * 160;
    const y = Math.random() * 160;
    const r = rand(1.5, 6);
    tc.fillStyle = Math.random() < 0.5 ? "rgba(74, 122, 62, 0.55)" : "rgba(52, 92, 46, 0.55)";
    tc.beginPath();
    tc.arc(x, y, r, 0, Math.PI * 2);
    tc.fill();
  }
  for (let i = 0; i < 26; i++) {
    tc.strokeStyle = "rgba(110, 150, 80, 0.22)";
    tc.lineWidth = 1;
    tc.beginPath();
    const x = Math.random() * 160;
    const y = Math.random() * 160;
    tc.moveTo(x, y);
    tc.lineTo(x + rand(-4, 4), y - rand(3, 7));
    tc.stroke();
  }
  groundPattern = ctx.createPattern(tile, "repeat");
}

function buildMinimapTerrain() {
  const size = 200;
  const canvasEl = document.createElement("canvas");
  canvasEl.width = size;
  canvasEl.height = size;
  const c = canvasEl.getContext("2d");
  const scale = size / MAP_SIZE;

  c.fillStyle = "#2f5a2c";
  c.fillRect(0, 0, size, size);

  c.fillStyle = "#4a6b3a";
  for (let i = 0; i < game.trees.length; i++) {
    const t = game.trees[i];
    c.beginPath();
    c.arc(t.x * scale, t.y * scale, Math.max(1.2, t.crownRadius * scale * 1.4), 0, Math.PI * 2);
    c.fill();
  }

  c.fillStyle = "#8a7a5c";
  for (let i = 0; i < game.houses.length; i++) {
    const h = game.houses[i];
    c.fillRect(h.x * scale, h.y * scale, h.w * scale, h.h * scale);
  }

  c.fillStyle = "rgba(67, 120, 70, 0.9)";
  for (let i = 0; i < game.bushes.length; i++) {
    const b = game.bushes[i];
    c.beginPath();
    c.arc(b.x * scale, b.y * scale, Math.max(1, b.radius * scale), 0, Math.PI * 2);
    c.fill();
  }

  minimapTerrain = canvasEl;
}

function isVisible(x, y, margin) {
  return x > game.camera.x - margin && x < game.camera.x + viewW + margin &&
         y > game.camera.y - margin && y < game.camera.y + viewH + margin;
}

function drawGround() {
  ctx.save();
  ctx.translate(-game.camera.x, -game.camera.y);
  ctx.fillStyle = groundPattern || "#3f6b38";
  ctx.fillRect(game.camera.x, game.camera.y, viewW, viewH);
  ctx.restore();
}

function drawZone() {
  const zone = game.zone;
  ctx.save();
  ctx.translate(-game.camera.x, -game.camera.y);

  ctx.beginPath();
  ctx.rect(game.camera.x - 20, game.camera.y - 20, viewW + 40, viewH + 40);
  ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2, true);
  ctx.fillStyle = "rgba(52, 108, 235, 0.22)";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(90, 160, 255, 0.9)";
  ctx.lineWidth = 4;
  ctx.stroke();

  if (!zone.finished) {
    ctx.beginPath();
    ctx.arc(zone.target.x, zone.target.y, zone.target.radius, 0, Math.PI * 2);
    ctx.setLineDash([16, 12]);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.75)";
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawLoot() {
  ctx.save();
  ctx.translate(-game.camera.x, -game.camera.y);
  for (let i = 0; i < game.loot.length; i++) {
    const item = game.loot[i];
    if (!isVisible(item.x, item.y, 60)) continue;
    const bob = Math.sin(game.time * 0.004 + item.bob) * 2.5;
    const x = item.x;
    const y = item.y + bob;

    ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
    ctx.beginPath();
    ctx.ellipse(item.x, item.y + 8, 13, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    if (item.kind === "weapon") {
      const def = WEAPONS[item.type];
      ctx.strokeStyle = def.color;
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x - 13, y + 5);
      ctx.lineTo(x + 11, y - 5);
      ctx.stroke();
      ctx.fillStyle = def.color;
      ctx.fillRect(x - 4, y - 1, 8, 8);
      ctx.strokeStyle = "rgba(0, 0, 0, 0.45)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x - 4, y - 1, 8, 8);
    } else if (item.kind === "medkit") {
      ctx.fillStyle = "#f2f5f2";
      ctx.fillRect(x - 10, y - 8, 20, 16);
      ctx.fillStyle = "#d3453a";
      ctx.fillRect(x - 2.5, y - 6, 5, 12);
      ctx.fillRect(x - 7, y - 1.5, 14, 5);
      ctx.strokeStyle = "rgba(0, 0, 0, 0.4)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x - 10, y - 8, 20, 16);
    } else if (item.kind === "armor") {
      ctx.fillStyle = "#4f83c8";
      ctx.beginPath();
      ctx.moveTo(x, y - 10);
      ctx.lineTo(x + 10, y - 4);
      ctx.lineTo(x + 8, y + 8);
      ctx.lineTo(x, y + 11);
      ctx.lineTo(x - 8, y + 8);
      ctx.lineTo(x - 10, y - 4);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawHouses() {
  ctx.save();
  ctx.translate(-game.camera.x, -game.camera.y);

  for (let i = 0; i < game.houses.length; i++) {
    const h = game.houses[i];
    if (!isVisible(h.x + h.w / 2, h.y + h.h / 2, Math.max(h.w, h.h))) continue;
    ctx.fillStyle = "#5b5240";
    ctx.fillRect(h.x, h.y, h.w, h.h);
    ctx.strokeStyle = "rgba(0, 0, 0, 0.25)";
    ctx.lineWidth = 2;
    ctx.strokeRect(h.x + 2, h.y + 2, h.w - 4, h.h - 4);
  }

  for (let i = 0; i < game.walls.length; i++) {
    const w = game.walls[i];
    if (!isVisible(w.x + w.w / 2, w.y + w.h / 2, Math.max(w.w, w.h) + 40)) continue;
    ctx.fillStyle = "#8a5a34";
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = "rgba(58, 34, 18, 0.85)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(w.x + 0.75, w.y + 0.75, w.w - 1.5, w.h - 1.5);
  }

  ctx.restore();
}

function drawTreeTrunks() {
  ctx.save();
  ctx.translate(-game.camera.x, -game.camera.y);
  for (let i = 0; i < game.trees.length; i++) {
    const t = game.trees[i];
    if (!isVisible(t.x, t.y, 120)) continue;
    ctx.fillStyle = "#6b4a2b";
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.trunkRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(44, 30, 16, 0.85)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

function drawCharacter(character) {
  if (character.isDead) return;
  if (character.isInBush && !character.isPlayer) return;
  if (!isVisible(character.x, character.y, 80)) return;

  const alpha = character.isInBush ? 0.45 : 1;
  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
  ctx.beginPath();
  ctx.ellipse(character.x + 2, character.y + 7, character.radius * 0.9, character.radius * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  const bodyColor = character.isPlayer ? "#3f8ede" : "#c0453c";
  const bodyDark = character.isPlayer ? "#28608f" : "#8a2f28";

  ctx.beginPath();
  ctx.arc(character.x, character.y, character.radius, 0, Math.PI * 2);
  ctx.fillStyle = character.hitFlash > 0 ? "#ffd0d0" : bodyColor;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = bodyDark;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(character.x, character.y, character.radius * 0.5, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
  ctx.fill();

  const weaponColor = character.weaponDef ? character.weaponDef.color : "#cfd6de";
  ctx.strokeStyle = weaponColor;
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(
    character.x + Math.cos(character.angle) * character.radius * 0.6,
    character.y + Math.sin(character.angle) * character.radius * 0.6,
  );
  ctx.lineTo(
    character.x + Math.cos(character.angle) * (character.radius + 16),
    character.y + Math.sin(character.angle) * (character.radius + 16),
  );
  ctx.stroke();

  if (character.muzzle > 0) {
    const mx = character.x + Math.cos(character.angle) * (character.radius + 20);
    const my = character.y + Math.sin(character.angle) * (character.radius + 20);
    ctx.fillStyle = "rgba(255, 224, 138, " + clamp(character.muzzle / 90, 0, 1) + ")";
    ctx.beginPath();
    ctx.arc(mx, my, 7, 0, Math.PI * 2);
    ctx.fill();
  }

  if (!character.isPlayer) {
    const barW = 44;
    const barX = character.x - barW / 2;
    const barY = character.y - character.radius - 16;
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.fillRect(barX - 1, barY - 1, barW + 2, 7);
    ctx.fillStyle = "#4ade80";
    ctx.fillRect(barX, barY, barW * clamp(character.hp / character.maxHp, 0, 1), 5);
    if (character.armor > 0) {
      ctx.fillStyle = "#3b82f6";
      ctx.fillRect(barX, barY - 3.5, barW * clamp(character.armor / character.maxArmor, 0, 1), 2.5);
    }
    if (character.isHealing) {
      ctx.fillStyle = "#f3c33c";
      ctx.font = "bold 11px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("+", character.x, barY - 8);
      ctx.textAlign = "left";
    }
  }

  if (character.isHealing) {
    ctx.strokeStyle = "rgba(90, 220, 130, 0.9)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(
      character.x, character.y, character.radius + 9,
      -Math.PI / 2,
      -Math.PI / 2 + Math.PI * 2 * (1 - character.healTimer / CONFIG.HEAL_TIME),
    );
    ctx.stroke();
  }

  ctx.restore();
}

function drawCharacters() {
  ctx.save();
  ctx.translate(-game.camera.x, -game.camera.y);
  for (let i = 0; i < game.characters.length; i++) {
    const c = game.characters[i];
    if (c.isDead) continue;
    if (c.isPlayer) continue;
    drawCharacter(c);
  }
  if (game.player && !game.player.isDead) drawCharacter(game.player);
  ctx.restore();
}

function drawBullets() {
  ctx.save();
  ctx.translate(-game.camera.x, -game.camera.y);
  ctx.lineCap = "round";
  for (let i = 0; i < game.bullets.length; i++) {
    const b = game.bullets[i];
    if (!isVisible(b.x, b.y, 60)) continue;
    const length = Math.hypot(b.vx, b.vy);
    const nx = b.vx / length;
    const ny = b.vy / length;
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(b.x - nx * 12, b.y - ny * 12);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.fillStyle = "#fff8dc";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawTreeCrowns() {
  ctx.save();
  ctx.translate(-game.camera.x, -game.camera.y);
  for (let i = 0; i < game.trees.length; i++) {
    const t = game.trees[i];
    if (!isVisible(t.x, t.y, 140)) continue;
    ctx.fillStyle = "rgba(34, 104, 48, 0.55)";
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.crownRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(70, 150, 70, 0.35)";
    ctx.beginPath();
    ctx.arc(t.x - 8, t.y - 8, t.crownRadius * 0.62, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawBushes() {
  ctx.save();
  ctx.translate(-game.camera.x, -game.camera.y);
  for (let i = 0; i < game.bushes.length; i++) {
    const b = game.bushes[i];
    if (!isVisible(b.x, b.y, 120)) continue;
    ctx.fillStyle = "rgba(126, 186, 92, 0.82)";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(158, 212, 118, 0.55)";
    ctx.beginPath();
    ctx.arc(b.x - b.radius * 0.25, b.y - b.radius * 0.25, b.radius * 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(60, 110, 50, 0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  ctx.save();
  ctx.translate(-game.camera.x, -game.camera.y);
  for (let i = 0; i < game.particles.length; i++) {
    const p = game.particles[i];
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---------- HUD ---------- */

function drawBar(x, y, width, height, ratio, color, backColor, label, textColor) {
  ctx.fillStyle = backColor;
  ctx.fillRect(x, y, width, height);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, width * clamp(ratio, 0, 1), height);
  ctx.strokeStyle = "rgba(0, 0, 0, 0.55)";
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, width, height);
  if (label) {
    ctx.font = "bold 12px system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillStyle = textColor || "#0d1116";
    ctx.fillText(label, x + 8, y + height / 2 + 0.5);
  }
}

function drawMinimap() {
  const size = 200;
  const padding = 16;
  const x = viewW - size - padding;
  const y = padding;
  const scale = size / MAP_SIZE;

  ctx.save();
  ctx.fillStyle = "rgba(10, 16, 22, 0.75)";
  ctx.fillRect(x - 4, y - 4, size + 8, size + 8);

  if (minimapTerrain) ctx.drawImage(minimapTerrain, x, y, size, size);

  const zone = game.zone;
  const zx = x + zone.x * scale;
  const zy = y + zone.y * scale;
  const zr = zone.radius * scale;

  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, size, size);
  ctx.clip();

  ctx.beginPath();
  ctx.rect(x, y, size, size);
  ctx.arc(zx, zy, zr, 0, Math.PI * 2, true);
  ctx.fillStyle = "rgba(52, 108, 235, 0.35)";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(zx, zy, zr, 0, Math.PI * 2);
  ctx.strokeStyle = "#5aa0ff";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  if (!zone.finished) {
    ctx.beginPath();
    ctx.arc(x + zone.target.x * scale, y + zone.target.y * scale, Math.max(2, zone.target.radius * scale), 0, Math.PI * 2);
    ctx.setLineDash([6, 5]);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.setLineDash([]);
  }

  const player = game.player;
  if (player && !player.isDead) {
    ctx.fillStyle = "#4fa3ff";
    ctx.beginPath();
    ctx.arc(x + player.x * scale, y + player.y * scale, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  ctx.restore();

  ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, size, size);
  ctx.restore();
}

function drawKillfeed() {
  const size = 200;
  const padding = 16;
  const right = viewW - padding;
  let y = padding + size + 26;

  ctx.save();
  ctx.textAlign = "right";
  ctx.font = "600 13px system-ui, sans-serif";

  for (let i = game.killfeed.length - 1; i >= 0; i--) {
    const entry = game.killfeed[i];
    const age = game.time - entry.time;
    const alpha = age > CONFIG.KILLFEED_LIFE - 900
      ? clamp((CONFIG.KILLFEED_LIFE - age) / 900, 0, 1)
      : 1;
    if (alpha <= 0) continue;

    ctx.globalAlpha = alpha;
    const textWidth = ctx.measureText(entry.text).width;
    const boxW = textWidth + 20;
    const boxH = 24;
    ctx.fillStyle = "rgba(10, 16, 22, 0.72)";
    ctx.fillRect(right - boxW, y, boxW, boxH);
    ctx.fillStyle = "rgba(243, 195, 60, 0.9)";
    ctx.fillRect(right - boxW, y, 3, boxH);
    ctx.fillStyle = "#e6eef5";
    ctx.fillText(entry.text, right - 8, y + 16.5);
    y += boxH + 6;
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawHUD() {
  const player = game.player;

  ctx.save();
  ctx.textBaseline = "alphabetic";

  const alive = game.characters.reduce((sum, c) => sum + (c.isDead ? 0 : 1), 0);
  ctx.textAlign = "center";
  ctx.font = "bold 22px system-ui, sans-serif";
  ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
  ctx.fillText("ALIVE: " + alive, viewW / 2 + 1, 35);
  ctx.fillStyle = "#ffffff";
  ctx.fillText("ALIVE: " + alive, viewW / 2, 34);

  ctx.font = "600 13px system-ui, sans-serif";
  ctx.fillStyle = "rgba(200, 220, 240, 0.85)";
  ctx.fillText(game.zone.statusText, viewW / 2, 56);

  const barX = 20;
  const hpBarY = viewH - 74;
  const barW = 250;

  drawBar(barX, hpBarY, barW, 20, player.hp / player.maxHp, "#4ade80", "rgba(8, 14, 10, 0.75)", "HP " + Math.ceil(player.hp));
  drawBar(barX, hpBarY + 28, barW, 14, player.armor / player.maxArmor, "#3b82f6", "rgba(8, 12, 20, 0.75)", "БРОНЯ " + Math.ceil(player.armor), "#eaf2ff");

  ctx.textAlign = "left";
  ctx.font = "600 13px system-ui, sans-serif";
  ctx.fillStyle = "rgba(220, 235, 245, 0.85)";
  ctx.fillText("Аптечки: " + player.medkits, barX, hpBarY + 64);

  const weapon = player.currentWeapon;
  const def = player.weaponDef;
  const rightX = viewW - 20;

  ctx.textAlign = "right";
  if (weapon && def) {
    const reserveText = player.reloadTimer > 0
      ? "ПЕРЕЗАРЯДКА " + (player.reloadTimer / 1000).toFixed(1) + " с"
      : weapon.mag + " / " + weapon.reserve;
    ctx.font = "600 15px system-ui, sans-serif";
    ctx.fillStyle = "rgba(220, 235, 245, 0.85)";
    ctx.fillText(def.name + ":", rightX, viewH - 66);
    ctx.font = "bold 34px system-ui, sans-serif";
    ctx.fillStyle = weapon.mag === 0 ? "#e35b4b" : "#ffffff";
    ctx.fillText(reserveText, rightX, viewH - 28);
    ctx.font = "600 12px system-ui, sans-serif";
    ctx.fillStyle = "rgba(200, 220, 240, 0.6)";
    ctx.fillText(weapon.mag + " в магазине · " + weapon.reserve + " в запасе", rightX, viewH - 8);
  } else {
    ctx.font = "600 15px system-ui, sans-serif";
    ctx.fillStyle = "rgba(220, 235, 245, 0.85)";
    ctx.fillText("Оружия нет", rightX, viewH - 46);
    ctx.font = "bold 16px system-ui, sans-serif";
    ctx.fillStyle = "#f3c33c";
    ctx.fillText("Найди лут и нажми E", rightX, viewH - 22);
  }

  if (player.isHealing) {
    const w = 220;
    const x = viewW / 2 - w / 2;
    const y = viewH - 120;
    drawBar(x, y, w, 10, 1 - player.healTimer / CONFIG.HEAL_TIME, "#4ade80", "rgba(8, 14, 10, 0.75)", "");
    ctx.textAlign = "center";
    ctx.font = "600 12px system-ui, sans-serif";
    ctx.fillStyle = "#c8f0d4";
    ctx.fillText("ЛЕЧЕНИЕ", viewW / 2, y - 6);
  }

  if (game.bulletsOwnerHit > 0) {
    const cx = mouse.x;
    const cy = mouse.y;
    ctx.strokeStyle = "rgba(255, 255, 255, " + clamp(game.bulletsOwnerHit / 140, 0, 1) + ")";
    ctx.lineWidth = 2;
    const s = 9;
    ctx.beginPath();
    ctx.moveTo(cx - s, cy - s);
    ctx.lineTo(cx - s / 3, cy - s / 3);
    ctx.moveTo(cx + s, cy - s);
    ctx.lineTo(cx + s / 3, cy - s / 3);
    ctx.moveTo(cx - s, cy + s);
    ctx.lineTo(cx - s / 3, cy + s / 3);
    ctx.moveTo(cx + s, cy + s);
    ctx.lineTo(cx + s / 3, cy + s / 3);
    ctx.stroke();
  }

  const cx = mouse.x;
  const cy = mouse.y;
  ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(cx - 11, cy);
  ctx.lineTo(cx - 4, cy);
  ctx.moveTo(cx + 4, cy);
  ctx.lineTo(cx + 11, cy);
  ctx.moveTo(cx, cy - 11);
  ctx.lineTo(cx, cy - 4);
  ctx.moveTo(cx, cy + 4);
  ctx.lineTo(cx, cy + 11);
  ctx.stroke();
  ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
  ctx.fillRect(cx - 1, cy - 1, 2, 2);

  const nearLoot = nearestLoot(player.x, player.y, CONFIG.PLAYER_PICKUP_RADIUS);
  if (nearLoot && !player.isDead) {
    const label = nearLoot.kind === "weapon"
      ? WEAPONS[nearLoot.type].name
      : nearLoot.kind === "medkit" ? "Аптечка" : "Бронежилет";
    ctx.textAlign = "center";
    ctx.font = "600 13px system-ui, sans-serif";
    const text = "E — подобрать: " + label;
    const width = ctx.measureText(text).width + 22;
    ctx.fillStyle = "rgba(10, 16, 22, 0.78)";
    ctx.fillRect(viewW / 2 - width / 2, viewH / 2 + 46, width, 26);
    ctx.fillStyle = "#f3c33c";
    ctx.fillText(text, viewW / 2, viewH / 2 + 64);
  }

  ctx.restore();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, viewW, viewH);

  drawGround();
  drawZone();
  drawLoot();
  drawHouses();
  drawTreeTrunks();
  drawParticles();
  drawCharacters();
  drawBullets();
  drawTreeCrowns();
  drawBushes();

  drawHUD();
  drawMinimap();
  drawKillfeed();
}

/* =========================================================================
   16. ПОДБОР ЛУТА ИГРОКОМ
   ========================================================================= */

function nearestLoot(x, y, radius) {
  let best = null;
  let bestDist = radius;
  for (let i = 0; i < game.loot.length; i++) {
    const item = game.loot[i];
    const d = distance(x, y, item.x, item.y);
    if (d < bestDist) {
      best = item;
      bestDist = d;
    }
  }
  return best;
}

function playerPickup() {
  const player = game.player;
  if (!player || player.isDead || game.state !== "playing") return;
  const item = nearestLoot(player.x, player.y, CONFIG.PLAYER_PICKUP_RADIUS);
  if (!item) return;
  pickUpLoot(player, item);
}

/* =========================================================================
   17. КОНЕЦ ИГРЫ
   ========================================================================= */

function finishGame(isVictory) {
  if (game.state === "over" || game.state === "victory") return;

  if (isVictory) {
    game.state = "victory";
    Sound.win();
    endSub.textContent = "Победитель";
    endTitle.textContent = "VICTORY ROYALE!";
    endTitle.classList.add("victoryTitle");
    endStats.innerHTML =
      "<div><span>Место</span><b>1 / " + CONFIG.TOTAL_PLAYERS + "</b></div>" +
      "<div><span>Убийств</span><b>" + game.player.kills + "</b></div>" +
      "<div><span>Выжил</span><b>" + Math.ceil(game.elapsed / 1000) + " с</b></div>";
  } else {
    game.state = "over";
    Sound.lose();
    const aliveAfter = game.characters.reduce((sum, c) => sum + (c.isDead ? 0 : 1), 0);
    const place = aliveAfter + 1;
    endSub.textContent = "";
    endTitle.textContent = "GAME OVER";
    endTitle.classList.remove("victoryTitle");
    endStats.innerHTML =
      "<div><span>Место</span><b>" + place + " / " + CONFIG.TOTAL_PLAYERS + "</b></div>" +
      "<div><span>Убийств</span><b>" + game.player.kills + "</b></div>" +
      "<div><span>Выжил</span><b>" + Math.ceil(game.elapsed / 1000) + " с</b></div>" +
      "<p style=\"width:100%;margin:14px 0 0;color:#9fb0c0;font-size:14px\">Вы заняли " +
      place + " место из " + CONFIG.TOTAL_PLAYERS + ". Убийств: " + game.player.kills + ".</p>";
  }

  endScreen.classList.remove("hidden");
  hintLine.style.opacity = "0";
  redFlash.style.opacity = "0";
}

function checkVictory() {
  if (game.state !== "playing") return;
  const player = game.player;
  if (!player || player.isDead) return;
  const aliveCount = game.characters.reduce((sum, c) => sum + (c.isDead ? 0 : 1), 0);
  if (aliveCount <= 1) finishGame(true);
}

/* =========================================================================
   18. ВВОД
   ========================================================================= */

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  canvas.width = Math.floor(viewW * dpr);
  canvas.height = Math.floor(viewH * dpr);
  canvas.style.width = viewW + "px";
  canvas.style.height = viewH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (game.camera && game.player) game.camera.snapTo(game.player);
}

window.addEventListener("resize", resize);

window.addEventListener("keydown", (event) => {
  const key = event.key.toLowerCase();
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) event.preventDefault();
  keys[key] = true;
  if (key === "e") playerPickup();
  if (key === "r" && game.state === "playing") game.player.startReload();
  if (key === "h" && game.state === "playing") game.player.useMedkit();
});

window.addEventListener("keyup", (event) => {
  keys[event.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
  for (const key in keys) keys[key] = false;
  mouse.down = false;
});

canvas.addEventListener("mousemove", (event) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = event.clientX - rect.left;
  mouse.y = event.clientY - rect.top;
});

canvas.addEventListener("mousedown", (event) => {
  if (event.button === 0) {
    mouse.down = true;
    mouse.pressed = true;
  }
});

window.addEventListener("mouseup", (event) => {
  if (event.button === 0) mouse.down = false;
});

canvas.addEventListener("contextmenu", (event) => event.preventDefault());

/* =========================================================================
   19. ЗАПУСК И ПЕРЕЗАПУСК
   ========================================================================= */

function startMatch() {
  generateWorld();
  spawnCharacters();
  game.zone = new SafeZone();
  game.camera = new Camera();
  game.bullets.length = 0;
  game.particles.length = 0;
  game.killfeed.length = 0;
  game.elapsed = 0;
  game.time = 0;
  game.bulletsOwnerHit = 0;
  game.state = "playing";

  buildMinimapTerrain();
  resize();
  game.camera.snapTo(game.player);

  startScreen.classList.add("hidden");
  endScreen.classList.add("hidden");
  endTitle.classList.remove("victoryTitle");
  hintLine.style.opacity = "1";
  clearTimeout(window.__hintTimer);
  window.__hintTimer = setTimeout(() => { hintLine.style.opacity = "0"; }, 14000);
  redFlash.style.opacity = "0";

  mouse.down = false;
  mouse.pressed = false;
  for (const key in keys) keys[key] = false;
}

function bootMenu() {
  generateWorld();
  spawnCharacters();
  game.zone = new SafeZone();
  game.camera = new Camera();
  game.state = "menu";
  buildMinimapTerrain();
  resize();
  game.camera.snapTo(game.player);
}

let lastTimestamp = 0;

function loop(timestamp) {
  if (!lastTimestamp) lastTimestamp = timestamp;
  const dt = Math.min(timestamp - lastTimestamp, 100);
  lastTimestamp = timestamp;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

document.getElementById("startBtn").addEventListener("click", () => {
  Sound.init();
  startMatch();
  canvas.focus();
});

window.addEventListener("pointerdown", () => Sound.init(), { once: true });
window.addEventListener("keydown", () => Sound.init(), { once: true });

document.getElementById("restartBtn").addEventListener("click", () => {
  startMatch();
});

createGroundPattern();
bootMenu();
requestAnimationFrame(loop);

/* Отладочная ссылка на состояние игры (удобно проверять в консоли браузера). */
window.BR = {
  game, CONFIG, WEAPONS, startMatch, keys, mouse,
  tick(ms, times) {
    for (let i = 0; i < times; i++) update(ms);
    draw();
  },
};
</script>
</body>
