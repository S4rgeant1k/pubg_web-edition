<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Royale 2D — королевская битва в браузере</title>
<meta name="description" content="Одиночная 2D battle royale в стиле PUBG/Surviv.io: 50 бойцов, лут, дома, кусты, синяя зона. Один HTML-файл, без библиотек.">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0d1116;
    color: #e8eef4;
    font-family: "Segoe UI", "Roboto", system-ui, -apple-system, sans-serif;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
    background: #33582f;
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(6, 10, 14, 0.78);
    backdrop-filter: blur(4px);
    z-index: 20;
    padding: 20px;
  }
  .overlay.hidden { display: none; }

  .card {
    width: min(600px, 94vw);
    padding: 34px 34px 26px;
    text-align: center;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: linear-gradient(160deg, rgba(20, 26, 34, 0.97), rgba(10, 14, 19, 0.98));
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
    animation: cardIn 0.35s ease;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  .card h1 {
    margin: 0 0 6px;
    font-size: clamp(26px, 4.6vw, 44px);
    letter-spacing: 0.1em;
    color: #f3c33c;
    text-transform: uppercase;
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: clamp(22px, 3.6vw, 34px);
    letter-spacing: 0.08em;
  }
  .card p {
    margin: 0 0 18px;
    color: #9fb0c0;
    font-size: 14px;
    line-height: 1.6;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px 20px;
    margin: 0 0 22px;
    padding: 16px 18px;
    text-align: left;
    font-size: 13px;
    color: #a9b8c6;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 8px;
  }
  .keys b {
    display: inline-block;
    min-width: 62px;
    color: #f3c33c;
    font-weight: 700;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: 0;
    border-radius: 5px;
    padding: 15px 34px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #1a1509;
    background: linear-gradient(180deg, #f6cd55, #e0ad24);
    box-shadow: 0 10px 30px rgba(243, 195, 60, 0.26);
    transition: transform 0.12s ease, box-shadow 0.15s ease;
  }
  button:hover { box-shadow: 0 12px 38px rgba(243, 195, 60, 0.45); }
  button:active { transform: translateY(1px); }

  .stats {
    display: flex;
    justify-content: center;
    gap: 34px;
    margin: 22px 0 24px;
  }
  .stats div { display: flex; flex-direction: column; gap: 4px; }
  .stats span {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #8a9aa9;
  }
  .stats b { font-size: 24px; color: #fff; }

  .victoryTitle {
    font-size: clamp(26px, 4.8vw, 46px) !important;
    letter-spacing: 0.06em;
    background: linear-gradient(180deg, #ffe9a3, #f3c33c 55%, #b8860b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent !important;
    animation: victoryPulse 1.6s ease-in-out infinite;
    text-shadow: 0 0 34px rgba(243, 195, 60, 0.35);
  }
  @keyframes victoryPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(243, 195, 60, 0.35)); }
    50% { transform: scale(1.05); filter: drop-shadow(0 0 26px rgba(243, 195, 60, 0.7)); }
  }
  .subTitle {
    font-size: clamp(15px, 2.4vw, 22px) !important;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #ffe9a3 !important;
    margin-bottom: 6px !important;
    animation: fadeUp 0.9s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  .hintLine {
    position: fixed;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: rgba(220, 232, 242, 0.35);
    pointer-events: none;
    z-index: 5;
    white-space: nowrap;
  }
  .redFlash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.18s ease;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(190, 20, 20, 0.75) 100%);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="redFlash" class="redFlash"></div>
<div id="hint" class="hintLine">WASD — движение · мышь — прицел · ЛКМ — огонь · E — подобрать · R — перезарядка · H — аптечка</div>

<div id="startScreen" class="overlay">
  <div class="card">
    <h1>Battle Royale 2D</h1>
    <p>50 бойцов, один остров, сужающаяся синяя зона.<br>Выживи последним — и забери победу.</p>
    <div class="keys">
      <div><b>WASD</b> движение</div>
      <div><b>Мышь</b> прицел</div>
      <div><b>ЛКМ</b> стрельба</div>
      <div><b>E</b> подобрать лут</div>
      <div><b>R</b> перезарядка</div>
      <div><b>H</b> аптечка</div>
    </div>
    <button id="startBtn">В бой</button>
  </div>
</div>

<div id="endScreen" class="overlay hidden">
  <div class="card">
    <div id="endSub" class="subTitle"></div>
    <h2 id="endTitle"></h2>
    <div id="endStats" class="stats"></div>
    <button id="restartBtn">Играть снова</button>
  </div>
</div>

<script>
"use strict";

/* =========================================================================
   1. ГЛОБАЛЬНЫЕ КОНСТАНТЫ
   ========================================================================= */

const CONFIG = {
  MAP_SIZE: 3000,
  TOTAL_PLAYERS: 50,
  CHARACTER_RADIUS: 20,
  BASE_SPEED: 4,
  SLOW_SPEED: 2.5,
  RELOAD_TIME: 2500,
  HEAL_TIME: 4000,
  HEAL_AMOUNT: 50,
  MAX_MEDKITS: 5,
  HOUSE_COUNT: 30,
  TREE_COUNT: 80,
  BUSH_COUNT: 60,
  LOOT_WEAPONS: 52,
  LOOT_MEDKITS: 30,
  LOOT_ARMORS: 16,
  ZONE_PHASES: 5,
  PHASE_WAIT: 25000,
  PHASE_SHRINK: 20000,
  ZONE_RADII: [3000, 1500, 750, 380, 180, 80],
  ZONE_DPS: [2, 5, 10, 12, 15],
  BOT_VISION: 400,
  BOT_PICKUP_RADIUS: 30,
  PLAYER_PICKUP_RADIUS: 40,
  KILLFEED_MAX: 4,
  KILLFEED_LIFE: 4000,
  STATIC_CELL: 250,
  CHAR_CELL: 100,
};

const MAP_SIZE = CONFIG.MAP_SIZE;
const WEAPONS = {
  pistol: {
    id: "pistol", name: "Пистолет", damage: 15, cooldown: 400, magSize: 8,
    range: 500, spread: 0.05, speed: 12, pellets: 1, auto: false,
    color: "#b9c2cc", reserve: 24,
  },
  rifle: {
    id: "rifle", name: "АК-47", damage: 20, cooldown: 120, magSize: 30,
    range: 700, spread: 0.12, speed: 16, pellets: 1, auto: true,
    color: "#e8b25a", reserve: 90,
  },
  shotgun: {
    id: "shotgun", name: "Дробовик", damage: 12, cooldown: 800, magSize: 2,
    range: 300, spread: 0.35, speed: 10, pellets: 5, auto: false,
    color: "#d97b4a", reserve: 12,
  },
  sniper: {
    id: "sniper", name: "Снайперка", damage: 65, cooldown: 1500, magSize: 5,
    range: 1200, spread: 0.01, speed: 25, pellets: 1, auto: false,
    heavy: true, color: "#8fb4e8", reserve: 20,
  },
};
const WEAPON_IDS = Object.keys(WEAPONS);

/* =========================================================================
   2. УТИЛИТЫ
   ========================================================================= */

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const distance = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const angleTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);

function angleDifference(a, b) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function pointInRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

function circleRectOverlap(cx, cy, cr, r) {
  const nx = clamp(cx, r.x, r.x + r.w);
  const ny = clamp(cy, r.y, r.y + r.h);
  return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < cr * cr;
}

function rectsOverlap(a, b, pad) {
  return a.x - pad < b.x + b.w && a.x + a.w + pad > b.x &&
         a.y - pad < b.y + b.h && a.y + a.h + pad > b.y;
}

/* =========================================================================
   2.1 ЗВУК (WebAudio, без файлов)
   ========================================================================= */

const Sound = {
  ctx: null,
  enabled: true,
  noiseBuffer: null,

  init() {
    if (this.ctx) {
      if (this.ctx.state === "suspended") this.ctx.resume();
      return;
    }
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) {
      this.enabled = false;
      return;
    }
    this.ctx = new AudioCtor();
    const rate = this.ctx.sampleRate;
    const buffer = this.ctx.createBuffer(1, Math.floor(rate * 0.4), rate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    this.noiseBuffer = buffer;
  },

  noise(duration, frequency, gain, type) {
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const source = ctx.createBufferSource();
    source.buffer = this.noiseBuffer;
    const filter = ctx.createBiquadFilter();
    filter.type = type || "bandpass";
    filter.frequency.value = frequency;
    const volume = ctx.createGain();
    const now = ctx.currentTime;
    volume.gain.setValueAtTime(gain, now);
    volume.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    source.connect(filter).connect(volume).connect(ctx.destination);
    source.start(now);
    source.stop(now + duration + 0.02);
  },

  tone(frequency, duration, gain, type, slideTo) {
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    const volume = ctx.createGain();
    const now = ctx.currentTime;
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(frequency, now);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), now + duration);
    volume.gain.setValueAtTime(gain, now);
    volume.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(volume).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  },

  shot(weaponId, isPlayer) {
    const gain = isPlayer ? 0.16 : 0.045;
    if (weaponId === "sniper") {
      this.noise(0.22, 900, gain * 1.4, "lowpass");
      this.tone(150, 0.16, gain, "triangle", 60);
    } else if (weaponId === "shotgun") {
      this.noise(0.18, 600, gain * 1.3, "lowpass");
      this.tone(100, 0.12, gain, "square", 50);
    } else if (weaponId === "rifle") {
      this.noise(0.1, 1400, gain, "bandpass");
      this.tone(210, 0.06, gain * 0.6, "square", 90);
    } else {
      this.noise(0.08, 2000, gain * 0.9, "bandpass");
      this.tone(320, 0.05, gain * 0.5, "square", 140);
    }
  },

  hit() { this.tone(1500, 0.05, 0.12, "square", 700); },
  kill() { this.tone(700, 0.09, 0.1, "triangle"); setTimeout(() => this.tone(1080, 0.13, 0.1, "triangle"), 90); },
  pickup() { this.tone(620, 0.07, 0.09, "triangle", 940); },
  reload() { this.noise(0.06, 2600, 0.07, "bandpass"); },
  heal() { this.tone(430, 0.4, 0.07, "sine", 760); },
  hurt() { this.noise(0.13, 240, 0.16, "lowpass"); },
  zone() { this.tone(150, 0.25, 0.07, "sawtooth", 90); },
  win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.28, 0.1, "triangle"), i * 150)); },
  lose() { this.tone(320, 0.6, 0.12, "triangle", 120); },
};

/* =========================================================================
   3. ПРОСТРАНСТВЕННАЯ СЕТКА
   ========================================================================= */

let queryStamp = 0;

class SpatialGrid {
  constructor(cellSize) {
    this.cell = cellSize;
    this.cols = Math.ceil(MAP_SIZE / cellSize) + 1;
    this.cells = new Map();
  }

  key(cx, cy) {
    return cy * this.cols + cx;
  }

  insert(obj, minX, minY, maxX, maxY) {
    const c = this.cell;
    const x0 = clamp(Math.floor(minX / c), 0, this.cols - 1);
    const x1 = clamp(Math.floor(maxX / c), 0, this.cols - 1);
    const y0 = clamp(Math.floor(minY / c), 0, this.cols - 1);
    const y1 = clamp(Math.floor(maxY / c), 0, this.cols - 1);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const k = this.key(x, y);
        let bucket = this.cells.get(k);
        if (!bucket) {
          bucket = [];
          this.cells.set(k, bucket);
        }
        bucket.push(obj);
      }
    }
  }

  insertCircle(obj, x, y, r) {
    this.insert(obj, x - r, y - r, x + r, y + r);
  }

  queryRect(minX, minY, maxX, maxY, out) {
    const result = out || [];
    result.length = 0;
    const stamp = ++queryStamp;
    const c = this.cell;
    const x0 = clamp(Math.floor(minX / c), 0, this.cols - 1);
    const x1 = clamp(Math.floor(maxX / c), 0, this.cols - 1);
    const y0 = clamp(Math.floor(minY / c), 0, this.cols - 1);
    const y1 = clamp(Math.floor(maxY / c), 0, this.cols - 1);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const bucket = this.cells.get(this.key(x, y));
        if (!bucket) continue;
        for (let i = 0; i < bucket.length; i++) {
          const obj = bucket[i];
          if (obj._qs === stamp) continue;
          obj._qs = stamp;
          result.push(obj);
        }
      }
    }
    return result;
  }

  queryCircle(x, y, r, out) {
    return this.queryRect(x - r, y - r, x + r, y + r, out);
  }
}

/* =========================================================================
   4. ИГРОВОЕ СОСТОЯНИЕ
   ========================================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const startScreen = document.getElementById("startScreen");
const endScreen = document.getElementById("endScreen");
const endTitle = document.getElementById("endTitle");
const endSub = document.getElementById("endSub");
const endStats = document.getElementById("endStats");
const redFlash = document.getElementById("redFlash");
const hintLine = document.getElementById("hint");

let viewW = 0;
let viewH = 0;
let dpr = 1;

const game = {
  state: "menu",
  time: 0,
  characters: [],
  bullets: [],
  loot: [],
  walls: [],
  trees: [],
  bushes: [],
  houses: [],
  wallGrid: null,
  trunkGrid: null,
  bushGrid: null,
  charGrid: null,
  zone: null,
  camera: null,
  killfeed: [],
  player: null,
  bulletsOwnerHit: 0,
  particles: [],
  elapsed: 0,
};

const mouse = { x: 0, y: 0, down: false, pressed: false };
const keys = Object.create(null);

/* Временные буферы, чтобы не аллоцировать массивы в игровом цикле. */
const scratchWalls = [];
const scratchTrunks = [];
const scratchBushes = [];
const scratchChars = [];
const scratchLoot = [];

/* =========================================================================
   5. ГЕНЕРАЦИЯ КАРТЫ
   ========================================================================= */

const MAP_CENTER = MAP_SIZE / 2;
const START_SAFE_RADIUS = 300;

function createEmptyWorld() {
  game.characters.length = 0;
  game.bullets.length = 0;
  game.loot.length = 0;
  game.walls.length = 0;
  game.trees.length = 0;
  game.bushes.length = 0;
  game.houses.length = 0;
  game.particles.length = 0;
  game.killfeed.length = 0;

  game.wallGrid = new SpatialGrid(CONFIG.STATIC_CELL);
  game.trunkGrid = new SpatialGrid(CONFIG.STATIC_CELL);
  game.bushGrid = new SpatialGrid(CONFIG.STATIC_CELL);
  game.charGrid = new SpatialGrid(CONFIG.CHAR_CELL);
}

function addWall(x, y, w, h) {
  const wall = { x, y, w, h };
  game.walls.push(wall);
  game.wallGrid.insert(wall, x, y, x + w, y + h);
  return wall;
}

function createHouse(x, y, w, h) {
  const T = 14;
  const doorSide = randInt(0, 3);
  const doorSize = 62;
  const house = { x, y, w, h, floor: true };
  game.houses.push(house);

  const splitSide = (side, start, length, horizontal, fixed, doorOffset) => {
    if (side !== doorSide) {
      if (horizontal) addWall(start, fixed, length, T);
      else addWall(fixed, start, T, length);
      return;
    }
    const doorStart = start + doorOffset;
    const doorEnd = doorStart + doorSize;
    if (horizontal) {
      if (doorStart - start > 2) addWall(start, fixed, doorStart - start, T);
      if (start + length - doorEnd > 2) addWall(doorEnd, fixed, start + length - doorEnd, T);
    } else {
      if (doorStart - start > 2) addWall(fixed, start, T, doorStart - start);
      if (start + length - doorEnd > 2) addWall(fixed, doorEnd, T, start + length - doorEnd);
    }
  };

  const horizontalOffset = rand(20, Math.max(24, w - doorSize - 20));
  const verticalOffset = rand(20, Math.max(24, h - doorSize - 20));

  splitSide(0, x, w, true, y, horizontalOffset);
  splitSide(1, x, w, true, y + h - T, horizontalOffset);
  splitSide(2, y + T, h - T * 2, false, x, verticalOffset - T);
  splitSide(3, y + T, h - T * 2, false, x + w - T, verticalOffset - T);
}

function generateWorld() {
  createEmptyWorld();

  const centerClear = (x, y, w, h, pad) => {
    const nx = clamp(MAP_CENTER, x, x + w);
    const ny = clamp(MAP_CENTER, y, y + h);
    return Math.hypot(nx - MAP_CENTER, ny - MAP_CENTER) > START_SAFE_RADIUS + pad;
  };

  for (let i = 0; i < CONFIG.HOUSE_COUNT; i++) {
    let placed = false;
    for (let attempt = 0; attempt < 220 && !placed; attempt++) {
      const w = rand(150, 300);
      const h = rand(150, 300);
      const x = rand(40, MAP_SIZE - w - 40);
      const y = rand(40, MAP_SIZE - h - 40);
      const candidate = { x, y, w, h };
      if (!centerClear(x, y, w, h, 60)) continue;
      let overlap = false;
      for (let j = 0; j < game.houses.length; j++) {
        if (rectsOverlap(candidate, game.houses[j], 60)) {
          overlap = true;
          break;
        }
      }
      if (overlap) continue;
      createHouse(x, y, w, h);
      placed = true;
    }
  }

  const validTrunkPosition = (x, y) => {
    if (distance(x, y, MAP_CENTER, MAP_CENTER) < START_SAFE_RADIUS - 80) return false;
    const near = game.wallGrid.queryCircle(x, y, 30, scratchWalls);
    for (let i = 0; i < near.length; i++) {
      if (pointInRect(x, y, near[i])) return false;
    }
    for (let i = 0; i < game.trees.length; i++) {
      if (distance(x, y, game.trees[i].x, game.trees[i].y) < 80) return false;
    }
    return true;
  };

  for (let i = 0; i < CONFIG.TREE_COUNT; i++) {
    let placed = false;
    for (let attempt = 0; attempt < 120 && !placed; attempt++) {
      const x = rand(50, MAP_SIZE - 50);
      const y = rand(50, MAP_SIZE - 50);
      if (!validTrunkPosition(x, y)) continue;
      const tree = { x, y, trunkRadius: 15, crownRadius: 40 };
      game.trees.push(tree);
      game.trunkGrid.insertCircle(tree, x, y, tree.trunkRadius);
      placed = true;
    }
  }

  const validBushPosition = (x, y) => {
    if (distance(x, y, MAP_CENTER, MAP_CENTER) < START_SAFE_RADIUS - 120) return false;
    for (let i = 0; i < game.bushes.length; i++) {
      if (distance(x, y, game.bushes[i].x, game.bushes[i].y) < 70) return false;
    }
    return true;
  };

  for (let i = 0; i < CONFIG.BUSH_COUNT; i++) {
    let placed = false;
    for (let attempt = 0; attempt < 120 && !placed; attempt++) {
      const x = rand(50, MAP_SIZE - 50);
      const y = rand(50, MAP_SIZE - 50);
      if (!validBushPosition(x, y)) continue;
      const bush = { x, y, radius: 35 };
      game.bushes.push(bush);
      game.bushGrid.insertCircle(bush, x, y, bush.radius);
      placed = true;
    }
  }

  spawnLoot();
}

function isFreeForLoot(x, y) {
  const walls = game.wallGrid.queryCircle(x, y, 26, scratchWalls);
  for (let i = 0; i < walls.length; i++) {
    if (pointInRect(x, y, walls[i])) return false;
  }
  const trunks = game.trunkGrid.queryCircle(x, y, 24, scratchTrunks);
  for (let i = 0; i < trunks.length; i++) {
    if (distance(x, y, trunks[i].x, trunks[i].y) < trunks[i].trunkRadius + 14) return false;
  }
  if (distance(x, y, MAP_CENTER, MAP_CENTER) < 120) return false;
  for (let i = 0; i < game.loot.length; i++) {
    if (distance(x, y, game.loot[i].x, game.loot[i].y) < 70) return false;
  }
  return true;
}

function randomPointOutsideOfHouses() {
  for (let attempt = 0; attempt < 260; attempt++) {
    const x = rand(70, MAP_SIZE - 70);
    const y = rand(70, MAP_SIZE - 70);
    if (isFreeForLoot(x, y)) return { x, y };
  }
  return { x: rand(70, MAP_SIZE - 70), y: rand(70, MAP_SIZE - 70) };
}

function spawnLoot() {
  for (let i = 0; i < CONFIG.LOOT_WEAPONS; i++) {
    const p = randomPointOutsideOfHouses();
    const id = pick(WEAPON_IDS);
    const def = WEAPONS[id];
    addLoot({
      kind: "weapon",
      type: id,
      mag: def.magSize,
      reserve: Math.round(def.reserve * rand(0.6, 1.2)),
      x: p.x,
      y: p.y,
      bob: Math.random() * Math.PI * 2,
    });
  }
  for (let i = 0; i < CONFIG.LOOT_MEDKITS; i++) {
    const p = randomPointOutsideOfHouses();
    addLoot({ kind: "medkit", x: p.x, y: p.y, bob: Math.random() * Math.PI * 2 });
  }
  for (let i = 0; i < CONFIG.LOOT_ARMORS; i++) {
    const p = randomPointOutsideOfHouses();
    addLoot({ kind: "armor", amount: 50, x: p.x, y: p.y, bob: Math.random() * Math.PI * 2 });
  }
}

function addLoot(item) {
  game.loot.push(item);
  return item;
}

function removeLoot(item) {
  const index = game.loot.indexOf(item);
  if (index >= 0) game.loot.splice(index, 1);
}

/* =========================================================================
   6. ПЕРСОНАЖ (ИГРОК И БОТЫ)
   ========================================================================= */

let characterSerial = 0;

class Character {
  constructor(x, y, isPlayer) {
    this.id = ++characterSerial;
    this.isPlayer = !!isPlayer;
    this.name = isPlayer ? "Игрок" : "Бот " + characterSerial;
    this.x = x;
    this.y = y;
    this.radius = CONFIG.CHARACTER_RADIUS;
    this.angle = rand(-Math.PI, Math.PI);
    this.hp = 100;
    this.maxHp = 100;
    this.armor = 0;
    this.maxArmor = 100;
    this.currentWeapon = null;
    this.medkits = 0;
    this.isDead = false;
    this.isHealing = false;
    this.isInBush = false;
    this.healTimer = 0;
    this.reloadTimer = 0;
    this.lastShotAt = -99999;
    this.lastDamageAt = -99999;
    this.zoneTick = 0;
    this.kills = 0;
    this.moving = 0;
    this.muzzle = 0;
    this.hitFlash = 0;
    this.deathTime = 0;
    this.killerName = null;
    this.damageTaken = 0;

    this.state = "LOOTING";
    this.target = null;
    this.targetAngle = 0;
    this.thinkTimer = rand(0, 200);
    this.reactionTimer = 0;
    this.strafeDir = Math.random() < 0.5 ? -1 : 1;
    this.strafeTimer = rand(300, 900);
    this.goal = null;
    this.goalTimer = 0;
    this.avoidTimer = 0;
    this.avoidDir = Math.random() < 0.5 ? -1 : 1;
    this.lastPosX = x;
    this.lastPosY = y;
    this.stuckTimer = 0;
    this.skill = rand(0.35, 0.85);
    this.burstLeft = 0;
    this.burstPause = 0;
    this.losTimer = 0;
    this.losOk = false;
  }

  get weaponDef() {
    return this.currentWeapon ? WEAPONS[this.currentWeapon.type] : null;
  }

  get ammoInMag() {
    return this.currentWeapon ? this.currentWeapon.mag : 0;
  }

  get ammoReserve() {
    return this.currentWeapon ? this.currentWeapon.reserve : 0;
  }

  get totalAmmo() {
    return this.ammoInMag + this.ammoReserve;
  }

  get isAlive() {
    return !this.isDead;
  }

  /* ---------- оружие ---------- */

  giveWeapon(type, mag, reserve) {
    this.currentWeapon = { type, mag, reserve };
    this.reloadTimer = 0;
  }

  startReload() {
    const def = this.weaponDef;
    if (!def || this.isDead) return;
    if (this.reloadTimer > 0) return;
    if (this.currentWeapon.mag >= def.magSize) return;
    if (this.currentWeapon.reserve <= 0) return;
    this.reloadTimer = CONFIG.RELOAD_TIME;
    this.isHealing = false;
    this.healTimer = 0;
    if (this.isPlayer) Sound.reload();
  }

  finishReload() {
    const def = this.weaponDef;
    if (!def) return;
    const need = def.magSize - this.currentWeapon.mag;
    const take = Math.min(need, this.currentWeapon.reserve);
    this.currentWeapon.mag += take;
    this.currentWeapon.reserve -= take;
  }

  canShoot(now) {
    const def = this.weaponDef;
    if (!def || this.isDead) return false;
    if (this.reloadTimer > 0) return false;
    if (this.isHealing) return false;
    if (this.currentWeapon.mag <= 0) return false;
    return now - this.lastShotAt >= def.cooldown;
  }

  shoot(now) {
    const def = this.weaponDef;
    if (!def) return false;
    if (this.currentWeapon.mag <= 0) {
      this.startReload();
      return false;
    }
    if (now - this.lastShotAt < def.cooldown) return false;
    if (this.reloadTimer > 0 || this.isHealing) return false;

    this.currentWeapon.mag--;
    this.lastShotAt = now;
    this.muzzle = 90;

    Sound.shot(def.id, this.isPlayer);
    const muzzleDistance = this.radius + 8;
    for (let i = 0; i < def.pellets; i++) {
      const spread = (Math.random() - 0.5) * 2 * def.spread;
      const angle = this.angle + spread;
      const bx = this.x + Math.cos(angle) * muzzleDistance;
      const by = this.y + Math.sin(angle) * muzzleDistance;
      game.bullets.push(new Bullet(bx, by, angle, def, this));
    }
    if (this.currentWeapon.mag <= 0) this.startReload();
    return true;
  }

  /* ---------- урон и смерть ---------- */

  takeDamage(amount, source, ignoreArmor) {
    if (this.isDead) return;
    let toHp = amount;
    if (!ignoreArmor && this.armor > 0) {
      const toArmor = Math.min(this.armor, amount * 0.5);
      this.armor -= toArmor;
      if (this.armor < 0) this.armor = 0;
      toHp = amount - toArmor;
    }
    this.hp -= toHp;
    this.damageTaken += toHp;
    this.lastDamageAt = game.time;
    this.hitFlash = 160;
    if (!ignoreArmor) {
      this.isHealing = false;
      this.healTimer = 0;
      if (source && !source.isDead && source !== this) {
        if (this.isPlayer) {
        redFlash.style.opacity = "1";
        Sound.hurt();
      }
        if (!this.isPlayer && this.currentWeapon) {
          this.target = source;
          this.state = "COMBAT";
          this.reactionTimer = rand(120, 340);
        }
      }
    }
    if (this.hp <= 0) {
      this.hp = 0;
      this.die(source);
    }
  }

  die(source) {
    if (this.isDead) return;
    this.isDead = true;
    this.isHealing = false;
    this.healTimer = 0;
    this.deathTime = game.time;
    this.currentWeaponSnapshot = this.currentWeapon ? { ...this.currentWeapon } : null;
    this.currentWeapon = null;
    this.moving = 0;

    dropLoot(this);

    const killerName = source && !source.isDead ? source.name : null;
    this.killerName = killerName;

    if (killerName && source) {
      source.kills++;
      addKillfeed(killerName + " убил " + this.name);
    } else {
      addKillfeed(this.name + " погиб в зоне");
    }

    spawnParticles(this.x, this.y, 18, source ? "#b53a3a" : "#4f7dff");

    if (this.isPlayer) {
      finishGame(false);
    } else {
      checkVictory();
    }
  }

  /* ---------- физика ---------- */

  resolveStaticCollisions() {
    const walls = game.wallGrid.queryCircle(this.x, this.y, this.radius + 30, scratchWalls);
    for (let i = 0; i < walls.length; i++) {
      const wall = walls[i];
      const nx = clamp(this.x, wall.x, wall.x + wall.w);
      const ny = clamp(this.y, wall.y, wall.y + wall.h);
      let dx = this.x - nx;
      let dy = this.y - ny;
      const distSq = dx * dx + dy * dy;
      if (distSq >= this.radius * this.radius) continue;
      if (distSq > 0.0001) {
        const dist = Math.sqrt(distSq);
        this.x += (dx / dist) * (this.radius - dist);
        this.y += (dy / dist) * (this.radius - dist);
      } else {
        const left = this.x - wall.x;
        const right = wall.x + wall.w - this.x;
        const top = this.y - wall.y;
        const bottom = wall.y + wall.h - this.y;
        const min = Math.min(left, right, top, bottom);
        if (min === left) this.x = wall.x - this.radius;
        else if (min === right) this.x = wall.x + wall.w + this.radius;
        else if (min === top) this.y = wall.y - this.radius;
        else this.y = wall.y + wall.h + this.radius;
      }
    }

    const trunks = game.trunkGrid.queryCircle(this.x, this.y, this.radius + 30, scratchTrunks);
    for (let i = 0; i < trunks.length; i++) {
      const tree = trunks[i];
      const dx = this.x - tree.x;
      const dy = this.y - tree.y;
      const minDist = this.radius + tree.trunkRadius;
      const distSq = dx * dx + dy * dy;
      if (distSq >= minDist * minDist || distSq < 0.0001) continue;
      const dist = Math.sqrt(distSq);
      this.x += (dx / dist) * (minDist - dist);
      this.y += (dy / dist) * (minDist - dist);
    }

    this.x = clamp(this.x, this.radius, MAP_SIZE - this.radius);
    this.y = clamp(this.y, this.radius, MAP_SIZE - this.radius);
  }

  updateBushState() {
    this.isInBush = false;
    const bushes = game.bushGrid.queryCircle(this.x, this.y, 120, scratchBushes);
    for (let i = 0; i < bushes.length; i++) {
      const bush = bushes[i];
      if (distance(this.x, this.y, bush.x, bush.y) < bush.radius) {
        this.isInBush = true;
        return;
      }
    }
  }

  move(deltaX, deltaY, dt, backwardAllowed) {
    let length = Math.hypot(deltaX, deltaY);
    if (length < 0.0001) {
      this.moving = 0;
      return;
    }
    deltaX /= length;
    deltaY /= length;

    let speed = CONFIG.BASE_SPEED;
    const def = this.weaponDef;
    if (def && def.heavy) speed = CONFIG.SLOW_SPEED;
    if (backwardAllowed) {
      const facingX = Math.cos(this.angle);
      const facingY = Math.sin(this.angle);
      if (deltaX * facingX + deltaY * facingY < -0.35) speed = Math.min(speed, CONFIG.SLOW_SPEED);
    }
    if (this.isHealing || this.isDead) speed = 0;

    const frames = clamp(dt / 16.6667, 0, 3);
    const step = speed * frames;
    this.x += deltaX * step;
    this.y += deltaY * step;
    this.moving = speed;
    this.resolveStaticCollisions();
  }

  /* ---------- обновление ---------- */

  update(dt) {
    if (this.isDead) return;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    if (this.muzzle > 0) this.muzzle -= dt;

    if (this.reloadTimer > 0) {
      this.reloadTimer -= dt;
      if (this.reloadTimer <= 0) {
        this.reloadTimer = 0;
        this.finishReload();
      }
    }

    if (this.isHealing) {
      this.healTimer -= dt;
      this.moving = 0;
      if (this.healTimer <= 0) {
        this.isHealing = false;
        this.healTimer = 0;
        if (this.medkits > 0) {
          this.medkits--;
          this.hp = Math.min(this.maxHp, this.hp + CONFIG.HEAL_AMOUNT);
        }
      }
    }

    this.updateBushState();
    this.applyZoneDamage(dt);
  }

  applyZoneDamage(dt) {
    const zone = game.zone;
    const outside = distance(this.x, this.y, zone.x, zone.y) > zone.radius;
    if (!outside) {
      this.zoneTick = 0;
      return;
    }
    this.zoneTick += dt;
    while (this.zoneTick >= 1000) {
      this.zoneTick -= 1000;
      const dps = CONFIG.ZONE_DPS[Math.min(zone.phaseIndex, CONFIG.ZONE_DPS.length - 1)];
      this.takeDamage(dps, null, true);
      if (this.isPlayer) Sound.zone();
      spawnParticles(this.x, this.y, 4, "#4f7dff");
      if (this.isDead) break;
    }
  }

  useMedkit() {
    if (this.isDead || this.isHealing || this.medkits <= 0) return false;
    if (this.hp >= this.maxHp) return false;
    this.isHealing = true;
    this.healTimer = CONFIG.HEAL_TIME;
    this.reloadTimer = 0;
    if (this.isPlayer) Sound.heal();
    return true;
  }
}

function dropLoot(character) {
  const dropWeapon = character.currentWeaponSnapshot;
  if (dropWeapon) {
    addLoot({
      kind: "weapon",
      type: dropWeapon.type,
      mag: dropWeapon.mag,
      reserve: dropWeapon.reserve,
      x: clamp(character.x + rand(-14, 14), 40, MAP_SIZE - 40),
      y: clamp(character.y + rand(-10, 10), 40, MAP_SIZE - 40),
      bob: Math.random() * Math.PI * 2,
    });
  }
  for (let i = 0; i < character.medkits; i++) {
    addLoot({
      kind: "medkit",

      y: clamp(character.y + rand(-24, 24), 40, MAP_SIZE - 40),
      bob: Math.random() * Math.PI * 2,
    });
  }
  if (character.armor > 0) {
    addLoot({
      kind: "armor",

      y: clamp(character.y + rand(-30, 30), 40, MAP_SIZE - 40),
      bob: Math.random() * Math.PI * 2,
    });
  }
}

/* =========================================================================
   7. ПУЛИ
   ========================================================================= */

class Bullet {
  constructor(x, y, angle, def, owner) {
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * def.speed;
    this.vy = Math.sin(angle) * def.speed;
    this.damage = def.damage;
    this.rangeLeft = def.range;
    this.owner = owner;
    this.ownerIsPlayer = !!(owner && owner.isPlayer);
    this.dead = false;
    this.color = def.id === "sniper" ? "#ffffff" : def.id === "shotgun" ? "#ffcf7a" : "#ffe08a";
  }

  update(dt) {
    const frames = clamp(dt / 16.6667, 0, 3);
    const perStep = 8;
    const totalDistance = Math.hypot(this.vx, this.vy) * frames;
    const steps = Math.max(1, Math.ceil(totalDistance / perStep));
    const stepFrames = frames / steps;

    for (let i = 0; i < steps; i++) {
      this.x += this.vx * stepFrames;
      this.y += this.vy * stepFrames;
      this.rangeLeft -= Math.hypot(this.vx, this.vy) * stepFrames;

      if (this.rangeLeft <= 0 || this.x < 0 || this.y < 0 || this.x > MAP_SIZE || this.y > MAP_SIZE) {
        this.dead = true;
        return;
      }
      if (this.hitsStatic()) {
        this.dead = true;
        spawnParticles(this.x, this.y, 4, "#c9b48a");
        return;
      }
      const hit = this.hitsCharacter();
      if (hit) {
        hit.takeDamage(this.damage, this.owner, false);
        spawnParticles(this.x, this.y, 5, "#c0392b");
        if (this.ownerIsPlayer) {
          game.bulletsOwnerHit = 140;
          Sound.hit();
          if (hit.isDead) Sound.kill();
        }
        this.dead = true;
        return;
      }
    }
  }

  hitsStatic() {
    const walls = game.wallGrid.queryCircle(this.x, this.y, 20, scratchWalls);
    for (let i = 0; i < walls.length; i++) {
      if (pointInRect(this.x, this.y, walls[i])) return true;
    }
    const trunks = game.trunkGrid.queryCircle(this.x, this.y, 20, scratchTrunks);
    for (let i = 0; i < trunks.length; i++) {
      if (distance(this.x, this.y, trunks[i].x, trunks[i].y) < trunks[i].trunkRadius) return true;
    }
    return false;
  }

  hitsCharacter() {
    const chars = game.charGrid.queryCircle(this.x, this.y, 60, scratchChars);
    for (let i = 0; i < chars.length; i++) {
      const c = chars[i];
      if (c.isDead || c === this.owner) continue;
      if (distance(this.x, this.y, c.x, c.y) < c.radius) return c;
    }
    return null;
  }
}

/* =========================================================================
   8. ЗОНА
   ========================================================================= */

class SafeZone {
  constructor() {
    this.x = MAP_CENTER;
    this.y = MAP_CENTER;
    this.radius = CONFIG.ZONE_RADII[0];
    this.phaseIndex = 0;
    this.state = "wait";
    this.timer = CONFIG.PHASE_WAIT;
    this.from = { x: this.x, y: this.y, radius: this.radius };
    this.target = this.computeNextCircle(0);
    this.finished = false;
  }

  computeNextCircle(phase) {
    const nextRadius = CONFIG.ZONE_RADII[Math.min(phase + 1, CONFIG.ZONE_RADII.length - 1)];
    const currentRadius = CONFIG.ZONE_RADII[Math.min(phase, CONFIG.ZONE_RADII.length - 1)];
    const maxOffset = Math.max(0, currentRadius - nextRadius);
    const angle = rand(0, Math.PI * 2);
    const offset = Math.sqrt(Math.random()) * maxOffset * 0.85;
    let cx = this.x + Math.cos(angle) * offset;
    let cy = this.y + Math.sin(angle) * offset;
    cx = clamp(cx, nextRadius + 20, MAP_SIZE - nextRadius - 20);
    cy = clamp(cy, nextRadius + 20, MAP_SIZE - nextRadius - 20);
    return { x: cx, y: cy, radius: nextRadius };
  }

  update(dt) {
    if (this.finished) return;
    this.timer -= dt;

    if (this.state === "wait") {
      if (this.timer <= 0) {
        this.state = "shrink";
        this.timer = CONFIG.PHASE_SHRINK;
        this.from = { x: this.x, y: this.y, radius: this.radius };
        this.target = this.computeNextCircle(this.phaseIndex);
      }
      return;
    }

    if (this.state === "shrink") {
      const t = 1 - clamp(this.timer / CONFIG.PHASE_SHRINK, 0, 1);
      const eased = t * t * (3 - 2 * t);
      this.radius = lerp(this.from.radius, this.target.radius, eased);
      this.x = lerp(this.from.x, this.target.x, eased);
      this.y = lerp(this.from.y, this.target.y, eased);

      if (this.timer <= 0) {
        this.radius = this.target.radius;
        this.x = this.target.x;
        this.y = this.target.y;
        this.phaseIndex++;
        if (this.phaseIndex >= CONFIG.ZONE_PHASES) {
          this.finished = true;
          this.state = "final";
          this.timer = 0;
          this.target = { x: this.x, y: this.y, radius: this.radius };
        } else {
          this.state = "wait";
          this.timer = CONFIG.PHASE_WAIT;
          this.target = this.computeNextCircle(this.phaseIndex);
        }
      }
    }
  }

  get damagePerSecond() {
    return CONFIG.ZONE_DPS[Math.min(this.phaseIndex, CONFIG.ZONE_DPS.length - 1)];
  }

  contains(x, y) {
    return distance(x, y, this.x, this.y) <= this.radius;
  }

  get statusText() {
    if (this.finished) return "Финальная зона · " + this.damagePerSecond + " HP/с вне круга";
    const seconds = Math.ceil(this.timer / 1000);
    if (this.state === "wait") return "Зона сожмётся через " + seconds + " с";
    return "Зона сжимается · " + seconds + " с";
  }
}

/* =========================================================================
   9. КАМЕРА
   ========================================================================= */

class Camera {
  constructor() {
    this.x = 0;
    this.y = 0;
  }

  follow(target, dt) {
    const targetX = clamp(target.x - viewW / 2, 0, Math.max(0, MAP_SIZE - viewW));
    const targetY = clamp(target.y - viewH / 2, 0, Math.max(0, MAP_SIZE - viewH));
    this.x = lerp(this.x, targetX, 0.1);
    this.y = lerp(this.y, targetY, 0.1);
  }

  snapTo(target) {
    this.x = clamp(target.x - viewW / 2, 0, Math.max(0, MAP_SIZE - viewW));
    this.y = clamp(target.y - viewH / 2, 0, Math.max(0, MAP_SIZE - viewH));
  }
}

/* =========================================================================
   10. КИЛЛ-ФИД И ЧАСТИЦЫ
